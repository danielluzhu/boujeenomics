<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A duck counting banknotes">
  <title>Boujeenomics</title>
  <!-- Original cartoon duck, deliberately not modelled on any existing character. -->
  <rect width="64" height="64" rx="14" fill="#14331f"/>

  <!-- head, sitting above the money so both read at 16px -->
  <circle cx="25" cy="21" r="12.5" fill="#fdfdfb"/>
  <path d="M36.5 17.6c6.2-1.5 12.4.5 13.9 3.2 1.5 2.7-1.3 5.3-7 6.3-3.8.7-7.2.2-8.9-1z" fill="#eda100"/>
  <path d="M38 24.1c3.2.8 7.2.7 10.4-.4" fill="none" stroke="#b87d00" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="28" cy="16.5" r="3.2" fill="#0b0b0b"/>
  <circle cx="29.1" cy="15.5" r="1.1" fill="#fdfdfb"/>

  <!-- fan of banknotes held in front -->
  <g stroke="#0b2415" stroke-width="1.6">
    <rect x="6"  y="36" width="33" height="18" rx="2.5" fill="#12996a" transform="rotate(-14 22.5 45)"/>
    <rect x="12" y="38" width="35" height="19" rx="2.5" fill="#1baf7a" transform="rotate(-6 29.5 47.5)"/>
    <rect x="19" y="40" width="37" height="20" rx="2.5" fill="#46d2a2"/>
  </g>
  <!-- a gold coin reads as a solid dot when the icon is tiny; a glyph would not -->
  <circle cx="37.5" cy="50" r="7" fill="#eda100" stroke="#0b2415" stroke-width="1.6"/>
  <circle cx="37.5" cy="50" r="3.2" fill="#c07f00"/>
</svg>
